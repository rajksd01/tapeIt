<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --surface: rgba(28, 28, 30, 0.94);
    --fg: rgba(255, 255, 255, 0.92);
    --hover: rgba(255, 255, 255, 0.10);
    --line: rgba(255, 255, 255, 0.14);
    --accent: #0a84ff;
    --red: #ff453a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    background: transparent;
    font: 500 13px/1 -apple-system, system-ui, sans-serif;
    color: var(--fg);
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; align-items: center; padding-top: 10px; }

  .pill {
    position: relative;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 10px;
    border-radius: 26px;
    background: var(--surface);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  button {
    all: unset;
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 17px;
    color: var(--fg);
    transition: background 90ms ease, color 90ms ease, transform 90ms ease-out;
  }
  button:hover { background: var(--hover); }
  button:active { transform: scale(0.9); }
  button.on { background: var(--accent); color: white; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

  .rec { width: 34px; padding: 0; gap: 8px; display: flex; justify-content: center; }
  .rec.live { width: auto; padding: 0 10px; }
  .rec .dot { width: 14px; height: 14px; border-radius: 7px; background: var(--red); transition: border-radius 180ms ease, transform 180ms ease; }
  .rec.live { background: rgba(255, 69, 58, 0.18); }
  .rec.live .dot { border-radius: 3px; transform: scale(0.8); }
  .rec .time { font-variant-numeric: tabular-nums; font-weight: 600; display: none; }
  .rec.live .time { display: inline; }

  #mic.on .slash, #sysaudio.on .slash { display: none; }
  .sep { flex: none; width: 1px; height: 20px; margin: 0 6px; background: var(--line); }
  .swatch { width: 26px; }
  .swatch i { width: 16px; height: 16px; border-radius: 8px; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.3); pointer-events: none; }
  .swatch.on { background: none; }
  .swatch.on i { box-shadow: 0 0 0 2px #1c1c1e, 0 0 0 3.5px var(--fg); }

  .status {
    position: absolute;
    inset: 8px 50px 8px 110px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: #2c2c2e;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 160ms ease, transform 200ms cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
  }
  .status.show { opacity: 1; transform: none; }

  .tip {
    position: fixed;
    top: 70px;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--surface);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.16), 0 4px 12px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -3px);
    transition: opacity 120ms ease, transform 120ms ease;
    pointer-events: none;
  }
  .sizes {
    position: fixed; top: 64px; display: none; gap: 2px; padding: 4px;
    border-radius: 10px; background: var(--surface);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.16), 0 4px 12px rgba(0, 0, 0, 0.3);
    transform: translateX(-50%);
  }
  .sizes.show { display: flex; }
  .tip.show { opacity: 1; transform: translate(-50%, 0); }
  .tip kbd { font: inherit; color: rgba(255, 255, 255, 0.5); margin-left: 8px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0ms !important; }
  }
</style>
</head>
<body>
<div class="pill" data-tauri-drag-region>
  <button id="rec" class="rec" data-tip="Record screen" data-key="⌃⌥R"><span class="dot"></span><span class="time" id="time">0:00</span></button>
  <button id="area" data-tip="Record an area" data-key="⌃⌥A">
    <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>
  </button>
  <button id="shot" data-tip="Screenshot — full screen">
    <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
  </button>
  <button id="shot-area" data-tip="Screenshot — drag an area">
    <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <span class="sep"></span>

  <button data-tool="pointer" data-tip="Pointer — use your apps" data-key="Esc">
    <svg viewBox="0 0 24 24"><path d="M5 3.5l13 6.5-5.5 1.8L10.7 17.5z"/></svg>
  </button>
  <button data-tool="pen" data-tip="Pen · double-click for size" data-key="⌃⌥D">
    <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
  </button>
  <button data-tool="highlighter" data-tip="Highlighter · double-click for size">
    <svg viewBox="0 0 24 24"><path d="M15 4l5 5-8 8-5-5z"/><path d="M7 12l-3 3v3h5l3-3"/></svg>
  </button>
  <button data-tool="arrow" data-tip="Arrow · double-click for size">
    <svg viewBox="0 0 24 24"><path d="M6 18L18 6M9 6h9v9"/></svg>
  </button>
  <button data-tool="rect" data-tip="Rectangle · double-click for size">
    <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
  </button>
  <button data-tool="text" data-tip="Text — click, type, Enter">
    <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
  </button>
  <button data-tool="step" data-tip="Steps — each click drops the next number: 1, 2, 3">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M11 9l1.5-1v8"/></svg>
  </button>
  <button data-tool="eraser" data-tip="Eraser — drag over drawings to remove them">
    <svg viewBox="0 0 24 24"><path d="M8 20l-4-4a1.5 1.5 0 0 1 0-2L14 4a1.5 1.5 0 0 1 2 0l4 4a1.5 1.5 0 0 1 0 2L10 20z"/><path d="M9 9l6 6M8 20h12"/></svg>
  </button>
  <span class="sep"></span>

  <button id="spotlight" data-tip="Spotlight — dim all but the cursor" data-key="⌃⌥S">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
  </button>
  <button id="camera" data-tip="Webcam bubble — drag to move" data-key="⌃⌥W">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg>
  </button>
  <button id="mic" data-tip="Record microphone">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
  <button id="sysaudio" data-tip="Record Mac sound">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
  <button id="life" data-key="⌃⌥F"></button>
  <span id="swatches" style="display:contents"></span>
  <span class="sep"></span>

  <button id="clear" data-tip="Clear drawings" data-key="⌃⌥C">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
  </button>
  <button id="menu" data-tip="Settings">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
  </button>
  <button id="minimize" data-tip="Minimize to menu bar" data-key="⌃⌥T">
    <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
  </button>
  <div class="status" id="status"></div>
</div>
<div class="tip" id="tip"></div>
<div class="sizes" id="sizes" role="menu" aria-label="Stroke size"></div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen, emitTo } = window.__TAURI__.event;

  const COLORS = [
    ['#ff453a', 'Red'], ['#ffd60a', 'Yellow'], ['#30d158', 'Green'], ['#0a84ff', 'Blue'], ['#ffffff', 'White'],
  ];
  const STATUS_MS = 2600;
  const TIP_DELAY_MS = 350;
  const LIFE = {
    fading: { tip: 'Ink fades away', icon: '<svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 16h13a3 3 0 1 1-3 3M3 12h17"/></svg>' },
    permanent: { tip: 'Ink stays until cleared', icon: '<svg viewBox="0 0 24 24"><path d="M12 16v5M8 3h8l-1 6 3 3v2H6v-2l3-3z"/></svg>' },
  };

  // Double-click a stroke tool to pick its size; a single click only selects the tool.
  const SIZES = { small: 4, medium: 7, large: 11 };
  const SIZED_TOOLS = new Set(['pen', 'highlighter', 'arrow', 'rect']);

  const ink = { tool: 'pen', color: COLORS[0][0], life: 'fading', size: 'medium' };
  let mode = 'pointer';
  let spotlight = false;
  let camera = false;
  let mic = false;
  let sysAudio = false;
  let startedAt = null;
  let statusTimer = null;
  let tipTimer = null;
  let tipVisible = false;

  const $ = (id) => document.getElementById(id);

  for (const [color, name] of COLORS) {
    const button = document.createElement('button');
    button.className = 'swatch';
    button.dataset.color = color;
    button.dataset.tip = name;
    button.innerHTML = `<i style="background:${color}"></i>`;
    $('swatches').append(button);
  }

  for (const [size, dot] of Object.entries(SIZES)) {
    const button = document.createElement('button');
    button.dataset.size = size;
    button.setAttribute('aria-label', `${size} stroke`);
    button.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="${dot / 2}" fill="currentColor" stroke="none"/></svg>`;
    $('sizes').append(button);
  }

  function openSizes(button) {
    const box = button.getBoundingClientRect();
    $('sizes').style.left = `${box.left + box.width / 2}px`;
    $('sizes').classList.add('show');
  }

  document.addEventListener('dblclick', (event) => {
    const button = event.target.closest('button[data-tool]');
    if (!button || !SIZED_TOOLS.has(button.dataset.tool)) return;
    hideTip();
    openSizes(button);
  });

  function render() {
    document.querySelectorAll('[data-tool]').forEach((button) => {
      const tool = button.dataset.tool;
      const selected = tool === 'pointer' ? mode !== 'draw' : mode === 'draw' && ink.tool === tool;
      button.classList.toggle('on', selected);
    });
    document.querySelectorAll('[data-color]').forEach((button) => button.classList.toggle('on', button.dataset.color === ink.color));
    $('spotlight').classList.toggle('on', spotlight);
    $('camera').classList.toggle('on', camera);
    $('mic').classList.toggle('on', mic);
    $('mic').dataset.tip = mic ? 'Microphone on' : 'Microphone off';
    $('sysaudio').classList.toggle('on', sysAudio);
    $('sysaudio').dataset.tip = sysAudio ? 'Mac sound on' : 'Mac sound off';
    document.querySelectorAll('[data-size]').forEach((button) => button.classList.toggle('on', button.dataset.size === ink.size));
    $('life').innerHTML = LIFE[ink.life].icon;
    $('life').dataset.tip = LIFE[ink.life].tip;
    $('rec').classList.toggle('live', startedAt !== null);
    $('rec').dataset.tip = startedAt ? 'Stop recording' : 'Record screen';
  }

  function syncInk() {
    render();
    emitTo('overlay', 'ink', ink);
  }

  function flash(message) {
    $('status').textContent = message;
    $('status').classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => $('status').classList.remove('show'), STATUS_MS);
  }

  async function call(command, args) {
    try {
      await invoke(command, args);
    } catch (error) {
      flash(String(error));
    }
  }

  // Mode changes render at once; the Rust round trip only confirms them.
  function setMode(next) {
    mode = next;
    render();
    call('set_mode', { mode: next });
  }

  function toggleSpotlight() {
    spotlight = !spotlight;
    render();
    call('set_spotlight', { on: spotlight });
  }

  // Custom tooltips: native ones only show while the app is focused.
  function showTip(button) {
    const tip = $('tip');
    const key = button.dataset.key ? `<kbd>${button.dataset.key}</kbd>` : '';
    tip.innerHTML = `${button.dataset.tip}${key}`;
    const box = button.getBoundingClientRect();
    tip.style.left = `${box.left + box.width / 2}px`;
    tip.classList.add('show');
    tipVisible = true;
  }

  function hideTip() {
    clearTimeout(tipTimer);
    $('tip').classList.remove('show');
  }

  document.querySelectorAll('.pill').forEach((pill) => pill.addEventListener('mouseleave', () => { hideTip(); tipVisible = false; }));
  document.addEventListener('mouseover', (event) => {
    const button = event.target.closest('button[data-tip]');
    if (!button) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(button), tipVisible ? 0 : TIP_DELAY_MS);
  });
  document.addEventListener('mouseout', (event) => {
    if (event.target.closest('button[data-tip]')) hideTip();
  });

  // pointerdown, not click: selection reacts on press.
  document.addEventListener('pointerdown', (event) => {
    const button = event.target.closest('button');
    if (!button || event.button !== 0) {
      $('sizes').classList.remove('show');
      return;
    }
    hideTip();

    if (button.dataset.size) {
      ink.size = button.dataset.size;
      $('sizes').classList.remove('show');
      return syncInk();
    }
    $('sizes').classList.remove('show');

    if (button.dataset.tool) {
      if (button.dataset.tool === 'pointer') return setMode('pointer');
      ink.tool = button.dataset.tool;
      syncInk();
      return setMode('draw');
    }
    if (button.dataset.color) {
      ink.color = button.dataset.color;
      return syncInk();
    }

    switch (button.id) {
      case 'rec': return call('record');
      case 'area': return startedAt ? flash('Stop the current recording first') : setMode('select');
      case 'spotlight': return toggleSpotlight();
      case 'camera': return call('toggle_camera');
      case 'mic': return call('toggle_mic');
      case 'sysaudio': return call('toggle_system_audio');
      case 'shot': return call('take_screenshot', { region: 'full' });
      case 'shot-area': return call('take_screenshot', { region: 'area' });
      case 'life':
        ink.life = ink.life === 'fading' ? 'permanent' : 'fading';
        syncInk();
        return showTip(button);
      case 'clear': return emitTo('overlay', 'clear');
      case 'menu': return call('show_menu');
      case 'minimize': return call('minimize');
    }
  });

  setInterval(() => {
    if (!startedAt) return;
    const seconds = Math.floor((Date.now() - startedAt) / 1000);
    $('time').textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  }, 250);

  listen('mode', (event) => { mode = event.payload; render(); });
  listen('status', (event) => flash(event.payload));
  listen('toggle-life', () => { ink.life = ink.life === 'fading' ? 'permanent' : 'fading'; syncInk(); flash(LIFE[ink.life].tip); });
  listen('toggle-spotlight', toggleSpotlight);
  listen('camera', (event) => { camera = event.payload; render(); });
  listen('mic', (event) => { mic = event.payload; render(); });
  invoke('mic_enabled').then((on) => { mic = on; render(); });
  listen('system-audio', (event) => { sysAudio = event.payload; render(); });
  invoke('system_audio_enabled').then((on) => { sysAudio = on; render(); });
  listen('recording', (event) => {
    startedAt = event.payload.active ? Date.now() : null;
    $('time').textContent = '0:00';
    render();
  });

  render();
</script>
</body>
</html>
