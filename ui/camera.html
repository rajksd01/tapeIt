<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { opacity: 0; transition: opacity 160ms ease; }
  body.ready { opacity: 1; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .bubble {
    position: absolute; inset: 6px;
    border-radius: 50%;
    overflow: hidden;
    background: #1c1c1e;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 6px 18px rgba(0, 0, 0, 0.35);
    transition: border-radius 220ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  body.square .bubble { border-radius: 22%; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scale(var(--zoom, 1)) scaleX(-1); transition: transform 80ms linear; pointer-events: none; }
  .grab { position: absolute; inset: 0; cursor: grab; }
  .message {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    color: rgba(255, 255, 255, 0.8); font: 500 13px -apple-system, system-ui, sans-serif;
  }
</style>
</head>
<body>
<div class="bubble">
  <video id="video" autoplay muted playsinline></video>
  <div class="message" id="message" hidden></div>
  <div class="grab" data-tauri-drag-region title="Drag to move · double-click to change shape"></div>
</div>
<script>
  const video = document.getElementById('video');
  const message = document.getElementById('message');


  // The bubble stays transparent until the first frame plays, so no empty shape shows.
  video.addEventListener('playing', () => document.body.classList.add('ready'));

  navigator.mediaDevices
    .getUserMedia({ video: { width: 640, height: 640 }, audio: false })
    .then((stream) => {
      video.srcObject = stream;
    })
    .catch((error) => {
      message.textContent = `Camera unavailable: ${error.message}`;
      message.hidden = false;
      document.body.classList.add('ready');
    });

  // Pinch on the trackpad zooms the picture inside the bubble; the bubble keeps its size.
  // WebKit sends pinch as gesture events, or as wheel events with ctrlKey set.
  // ponytail: digital zoom of a 640 px feed, blurs past ~2.5x; request a larger feed if people zoom further.
  const MIN_ZOOM = 1;
  const MAX_ZOOM = 2.5;
  const WHEEL_STEP = 0.01;
  let zoom = MIN_ZOOM;
  let gestureStart = MIN_ZOOM;

  function setZoom(next) {
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, next));
    document.body.style.setProperty('--zoom', zoom);
  }

  addEventListener('gesturestart', (event) => {
    event.preventDefault();
    gestureStart = zoom;
  });
  addEventListener('gesturechange', (event) => {
    event.preventDefault();
    setZoom(gestureStart * event.scale);
  });
  addEventListener('wheel', (event) => {
    if (!event.ctrlKey) {
      return;
    }
    event.preventDefault();
    setZoom(zoom - event.deltaY * WHEEL_STEP);
  }, { passive: false });

  document.querySelector('.grab').addEventListener('dblclick', () => document.body.classList.toggle('square'));
</script>
</body>
</html>
