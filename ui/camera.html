<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .bubble {
    position: absolute; inset: 6px;
    border-radius: 50%;
    overflow: hidden;
    background: #1c1c1e;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 6px 18px rgba(0, 0, 0, 0.35);
    transition: border-radius 220ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  body.square .bubble { border-radius: 22%; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }
  .grab { position: absolute; inset: 0; cursor: grab; }
  .message {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    color: rgba(255, 255, 255, 0.8); font: 500 13px -apple-system, system-ui, sans-serif;
  }
</style>
</head>
<body>
<div class="bubble">
  <video id="video" autoplay muted playsinline></video>
  <div class="message" id="message">Starting camera…</div>
  <div class="grab" data-tauri-drag-region title="Drag to move · double-click to change shape"></div>
</div>
<script>
  const video = document.getElementById('video');
  const message = document.getElementById('message');

  navigator.mediaDevices
    .getUserMedia({ video: { width: 640, height: 640 }, audio: false })
    .then((stream) => {
      video.srcObject = stream;
      message.remove();
    })
    .catch((error) => {
      message.textContent = `Camera unavailable: ${error.message}`;
    });

  document.querySelector('.grab').addEventListener('dblclick', () => document.body.classList.toggle('square'));
</script>
</body>
</html>
