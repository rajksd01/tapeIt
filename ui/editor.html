<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #161618;
    --panel: #1f1f22;
    --line: rgba(255, 255, 255, 0.1);
    --fg: rgba(255, 255, 255, 0.92);
    --dim: rgba(255, 255, 255, 0.55);
    --accent: #0a84ff;
    --handle: #ffd60a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 500 13px/1.3 -apple-system, system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  body { display: grid; grid-template-rows: 44px 1fr auto auto; }

  .titlebar { display: flex; align-items: center; justify-content: center; color: var(--dim); font-weight: 600; }

  .stage { min-height: 0; padding: 0 24px; display: grid; place-items: center; }
  video { max-width: 100%; max-height: 100%; border-radius: 10px; background: black; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
  .empty { color: var(--dim); }

  .timeline-row { display: flex; align-items: center; gap: 14px; padding: 18px 24px 10px; }
  button {
    all: unset;
    display: grid;
    place-items: center;
    border-radius: 8px;
    transition: background 90ms ease, transform 90ms ease-out, opacity 90ms ease;
  }
  button:active { transform: scale(0.95); }
  .play { width: 34px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.1); }
  .play:hover { background: rgba(255, 255, 255, 0.16); }
  svg { width: 16px; height: 16px; fill: currentColor; }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 96px; text-align: right; }

  .track { position: relative; flex: 1; height: 44px; border-radius: 8px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
  .kept { position: absolute; top: 0; bottom: 0; border: 2px solid var(--handle); border-radius: 8px; background: rgba(255, 214, 10, 0.08); pointer-events: none; }
  .handle {
    position: absolute; top: -2px; bottom: -2px; width: 14px; margin-left: -7px;
    border-radius: 5px; background: var(--handle); cursor: ew-resize;
    display: grid; place-items: center;
  }
  .handle::after { content: ''; width: 2px; height: 14px; border-radius: 1px; background: rgba(0, 0, 0, 0.45); }
  .playhead { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: white; border-radius: 1px; pointer-events: none; box-shadow: 0 0 4px rgba(0, 0, 0, 0.6); }
  .click-mark { position: absolute; bottom: 6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 3px; background: var(--accent); pointer-events: none; }

  .export-row { display: flex; align-items: center; gap: 12px; padding: 10px 24px 22px; }
  .segmented { display: flex; padding: 2px; border-radius: 9px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .segmented button { padding: 6px 14px; border-radius: 7px; color: var(--dim); font-weight: 600; }
  .segmented button.on { background: rgba(255, 255, 255, 0.14); color: var(--fg); }

  .toggle { display: flex; align-items: center; gap: 8px; color: var(--fg); }
  .toggle input { appearance: none; width: 32px; height: 20px; border-radius: 10px; background: rgba(255, 255, 255, 0.18); position: relative; transition: background 150ms ease; }
  .toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: white; transition: transform 180ms cubic-bezier(0.2, 0.9, 0.3, 1); }
  .toggle input:checked { background: #30d158; }
  .toggle input:checked::after { transform: translateX(12px); }
  .toggle.disabled { opacity: 0.4; }
  .toggle small { color: var(--dim); }

  .spacer { flex: 1; }
  .result { color: var(--dim); }
  .result a { color: var(--accent); cursor: pointer; margin-left: 6px; }

  .export { padding: 9px 18px; border-radius: 9px; background: var(--accent); color: white; font-weight: 600; min-width: 108px; position: relative; overflow: hidden; }
  .export:hover { opacity: 0.92; }
  .export.busy { background: rgba(10, 132, 255, 0.3); pointer-events: none; }
  .export .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width 150ms linear; }
  .export span { position: relative; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0ms !important; }
  }
</style>
</head>
<body>
<div class="titlebar" data-tauri-drag-region id="title">TapeIt</div>

<div class="stage"><video id="video" playsinline></video></div>

<div class="timeline-row">
  <button class="play" id="play" title="Play / pause (Space)"><svg viewBox="0 0 16 16" id="play-icon"><path d="M4 2.5v11l9-5.5z"/></svg></button>
  <div class="track" id="track">
    <div class="kept" id="kept"></div>
    <div class="handle" id="start-handle" title="Drag to trim the start"></div>
    <div class="handle" id="end-handle" title="Drag to trim the end"></div>
    <div class="playhead" id="playhead"></div>
  </div>
  <div class="time" id="time">0:00.0 / 0:00.0</div>
</div>

<div class="export-row">
  <div class="segmented" id="format">
    <button data-format="mp4" class="on">MP4</button>
    <button data-format="gif">GIF</button>
  </div>
  <label class="toggle" id="zoom-toggle">
    <input type="checkbox" id="zoom">
    <span>Zoom on clicks</span>
    <small id="click-count"></small>
  </label>
  <div class="spacer"></div>
  <div class="result" id="result"></div>
  <button class="export" id="export"><div class="bar" id="bar" style="width:0"></div><span id="export-label">Export</span></button>
</div>

<script>
  const { invoke, convertFileSrc } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  const MIN_LENGTH_SECONDS = 0.5;
  const PLAY = '<path d="M4 2.5v11l9-5.5z"/>';
  const PAUSE = '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>';

  const $ = (id) => document.getElementById(id);
  const video = $('video');

  let duration = 0;
  let start = 0;
  let end = 0;
  let format = 'mp4';
  let lastExport = null;

  function clock(seconds) {
    const minutes = Math.floor(seconds / 60);
    return `${minutes}:${(seconds - minutes * 60).toFixed(1).padStart(4, '0')}`;
  }

  function fraction(seconds) {
    return duration ? `${(seconds / duration) * 100}%` : '0%';
  }

  function render() {
    $('start-handle').style.left = fraction(start);
    $('end-handle').style.left = fraction(end);
    $('kept').style.left = fraction(start);
    $('kept').style.width = duration ? `${((end - start) / duration) * 100}%` : '0';
    $('playhead').style.left = fraction(video.currentTime);
    $('time').textContent = `${clock(Math.max(0, video.currentTime - start))} / ${clock(end - start)}`;
    // Rewriting the SVG 60 times a second forces a re-parse; only swap it when play state flips.
    const icon = video.paused ? PLAY : PAUSE;
    if ($('play-icon').dataset.icon !== icon) {
      $('play-icon').innerHTML = icon;
      $('play-icon').dataset.icon = icon;
    }
  }

  function timeAt(clientX) {
    const box = $('track').getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - box.left) / box.width)) * duration;
  }

  function drag(handle, apply) {
    handle.addEventListener('pointerdown', (event) => {
      event.stopPropagation();
      handle.setPointerCapture(event.pointerId);
      video.pause();
      const move = (moveEvent) => {
        apply(timeAt(moveEvent.clientX));
        render();
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', () => handle.removeEventListener('pointermove', move), { once: true });
    });
  }

  drag($('start-handle'), (seconds) => {
    start = Math.min(seconds, end - MIN_LENGTH_SECONDS);
    video.currentTime = start;
  });
  drag($('end-handle'), (seconds) => {
    end = Math.max(seconds, start + MIN_LENGTH_SECONDS);
    video.currentTime = end;
  });

  $('track').addEventListener('pointerdown', (event) => {
    video.currentTime = Math.max(start, Math.min(end, timeAt(event.clientX)));
    render();
  });

  function togglePlay() {
    if (!video.paused) return video.pause();
    if (video.currentTime >= end - 0.05 || video.currentTime < start) video.currentTime = start;
    video.play();
  }
  $('play').addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  addEventListener('keydown', (event) => {
    if (event.code !== 'Space') return;
    event.preventDefault();
    togglePlay();
  });

  // Playback stays inside the trimmed range.
  function follow() {
    if (!video.paused && video.currentTime >= end) {
      video.pause();
      video.currentTime = end;
    }
    render();
    requestAnimationFrame(follow);
  }

  document.querySelectorAll('[data-format]').forEach((button) => {
    button.addEventListener('click', () => {
      format = button.dataset.format;
      document.querySelectorAll('[data-format]').forEach((other) => other.classList.toggle('on', other === button));
    });
  });

  $('export').addEventListener('click', async () => {
    $('export').classList.add('busy');
    $('export-label').textContent = 'Exporting…';
    $('bar').style.width = '0';
    $('result').textContent = '';
    try {
      const message = await invoke('export_clip', { request: { start, end, format, zoom: $('zoom').checked } });
      showResult(message);
    } catch (error) {
      $('result').textContent = String(error);
    } finally {
      $('export').classList.remove('busy');
      $('export-label').textContent = 'Export';
      $('bar').style.width = '0';
    }
  });

  function showResult(message) {
    $('result').innerHTML = '';
    $('result').append(message);
    if (!lastExport) return;
    const link = document.createElement('a');
    link.textContent = 'Show in Finder';
    link.onclick = () => invoke('reveal', { path: lastExport });
    $('result').append(link);
  }

  listen('export-progress', (event) => { $('bar').style.width = `${event.payload * 100}%`; });
  listen('exported', (event) => { lastExport = event.payload; });

  async function load() {
    const session = await invoke('get_session');
    if (!session) {
      document.querySelector('.stage').innerHTML = '<p class="empty">No recording yet.</p>';
      return;
    }

    $('title').textContent = session.path.split('/').pop();
    video.src = convertFileSrc(session.path);
    video.addEventListener('loadedmetadata', () => {
      duration = video.duration;
      start = 0;
      end = duration;

      for (const click of session.clicks) {
        if (click.seconds > duration) continue;
        const mark = document.createElement('div');
        mark.className = 'click-mark';
        mark.style.left = fraction(click.seconds);
        $('track').append(mark);
      }
      render();
    });

    const clicks = session.clicks.length;
    $('click-count').textContent = clicks ? `${clicks} click${clicks === 1 ? '' : 's'}` : 'no clicks recorded';
    $('zoom').disabled = clicks === 0;
    $('zoom-toggle').classList.toggle('disabled', clicks === 0);

    requestAnimationFrame(follow);
  }

  load();
</script>
</body>
</html>
