[package]
name = "screenpen"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
screencapturekit = { version = "12", features = ["macos_15_0"] }
objc2-app-kit = "0.3"
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "block2"] }
objc2-core-media = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2-core-foundation = "0.3"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
security-framework = "3"
